<ion-content class="signup-content">
  <div class="signup-page">
    <div class="signup-brand">
      <app-nets-logo size="sm"></app-nets-logo>
      <h1>Create account</h1>
      <p>Sign up with your mobile number and PIN</p>
    </div>

    <div class="signup-form">
      <label>
        Full name
        <input
          type="text"
          maxlength="40"
          [value]="name"
          placeholder="e.g. Adam Cheng"
          autocomplete="name"
          (input)="onNameInput($event)"
        />
      </label>

      <label>
        Mobile number
        <div class="phone-prefix-row">
          <span class="phone-prefix">+65</span>
          <input
            type="tel"
            inputmode="numeric"
            maxlength="8"
            [value]="phoneDigits"
            placeholder="Mobile number"
            autocomplete="tel-national"
            (input)="onPhoneInput($event)"
          />
        </div>
      </label>

      <label>
        Email (optional)
        <input
          type="email"
          [value]="email"
          placeholder="you@email.com"
          autocomplete="email"
          (input)="onEmailInput($event)"
        />
      </label>

      <label>
        PIN
        <input
          type="password"
          [value]="pin"
          maxlength="6"
          inputmode="numeric"
          placeholder="6-digit PIN"
          autocomplete="new-password"
          (input)="onPinInput($event)"
        />
      </label>

      <label>
        Confirm PIN
        <input
          type="password"
          [value]="confirmPin"
          maxlength="6"
          inputmode="numeric"
          placeholder="Re-enter PIN"
          autocomplete="new-password"
          (input)="onConfirmPinInput($event)"
        />
      </label>

      @if (errorMessage) {
        <p class="error-message">{{ errorMessage }}</p>
      }

      <ion-button expand="block" class="signup-btn" [disabled]="isLoading" (click)="submitSignup()">
        {{ isLoading ? 'Creating account...' : 'Create Account' }}
      </ion-button>

      <button type="button" class="login-link" (click)="goToLogin()">Already have an account? Sign in</button>
    </div>
  </div>
</ion-content>
