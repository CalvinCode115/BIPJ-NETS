<ion-header class="nets-page-header">
  <ion-toolbar class="nets-page-toolbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goBack()">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Rewards Marketplace</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="marketplace-content">

  <div class="marketplace-grid">
    <div class="marketplace-card" *ngFor="let reward of rewards">
      <div class="marketplace-image">
        <span class="marketplace-emoji">{{ reward.emoji }}</span>
      </div>
      <span class="marketplace-name">{{ reward.name }}</span>
      <span class="marketplace-description">{{ reward.description }}</span>
      <ion-button
        expand="block"
        shape="round"
        class="redeem-btn"
        (click)="redeem(reward)">
        {{ reward.points }} Pts
      </ion-button>
    </div>
  </div>

</ion-content>
