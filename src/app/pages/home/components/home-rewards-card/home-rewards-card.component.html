<div class="rewards-card">
  <p class="rewards-title">NETS Rewards</p>

  <div class="rewards-points">
    <span class="rewards-points-value">{{ currentPoints | number }}</span>
    <span class="rewards-points-unit">pts</span>
  </div>

  <div class="rewards-metric">
    <div class="rewards-metric-top">
      <span class="rewards-metric-label">Reward progress</span>
      <span class="rewards-metric-value">{{ currentPoints | number }} / {{ targetPoints | number }}</span>
    </div>
    <div class="rewards-bar">
      <div class="rewards-bar-fill" [style.width.%]="rewardsProgress"></div>
    </div>
  </div>

  @if (onboarded && pet) {
  <div class="rewards-metric">
    <div class="rewards-xp-amount">
      <span class="rewards-xp-value">{{ pet.xp }}</span>
      <span class="rewards-xp-unit">XP</span>
    </div>
    <div class="rewards-metric-top">
      <span class="rewards-metric-label">Payogotchi · {{ pet.stage }} Lv {{ pet.level }}</span>
      <span class="rewards-metric-value">{{ pet.xp }}/{{ pet.xpMax }} XP</span>
    </div>
    <div class="rewards-bar">
      <div class="rewards-bar-fill rewards-bar-fill--xp" [style.width.%]="xpPercent"></div>
    </div>
  </div>
  } @else {
  <button type="button" class="rewards-metric rewards-metric--teaser" (click)="onTeaserClick()">
    <div class="rewards-metric-top">
      <span class="rewards-metric-label">Payogotchi</span>
      <span class="rewards-metric-value rewards-metric-value--cta">Hatch to earn XP</span>
    </div>
    <div class="rewards-bar">
      <div class="rewards-bar-fill rewards-bar-fill--xp" style="width: 0%"></div>
    </div>
  </button>
  }
</div>
